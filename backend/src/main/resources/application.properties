spring.application.name=weather-api

# Render sets PORT; local dev uses 8080
server.port=${PORT:8080}

# -------------------------------------------------------------------
# Database (local defaults)
# -------------------------------------------------------------------
# On Render, set these environment variables (Spring Boot maps them here):
#   SPRING_DATASOURCE_URL       — JDBC URL, e.g. jdbc:mysql://host:3306/dbname?sslMode=REQUIRED
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# Clever Cloud's MYSQL_ADDON_URI uses mysql:// — convert to jdbc:mysql:// for SPRING_DATASOURCE_URL.
spring.datasource.url=jdbc:mysql://localhost:3306/weatherwise_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=password123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Settings
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# File Upload Settings
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
app.uploads-dir=src/main/resources/static/uploads

# -------------------------------------------------------------------
# Environment Base URLs
# -------------------------------------------------------------------
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# -------------------------------------------------------------------
# Third-Party APIs
# -------------------------------------------------------------------
openweathermap.api.key=42f8449d2dde8f937760d0b8aec0a930

# -------------------------------------------------------------------
# Security / JWT Configuration
# -------------------------------------------------------------------
security.jwt.secret=${SECURITY_JWT_SECRET:change-me-in-prod-change-me-in-prod-change-me-in-prod-32bytes}
security.jwt.expiration-seconds=86400

# -------------------------------------------------------------------
# Optional SMTP Email Configuration
# -------------------------------------------------------------------
# Leave spring.mail.username empty to skip sending (scheduler exits early).
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
