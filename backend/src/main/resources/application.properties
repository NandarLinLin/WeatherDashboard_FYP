spring.application.name=weather-api
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (Dynamic Cloud + Local Fallback)
# -------------------------------------------------------------------
# On Render, this will automatically read your Clever Cloud variables.
# On your Mac, it will seamlessly fall back to your local localhost MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/weatherwise_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password123}

# -------------------------------------------------------------------
# JPA / Hibernate Settings
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# File Upload Settings
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
app.uploads-dir=src/main/resources/static/uploads

# -------------------------------------------------------------------
# Environment Base URLs
# -------------------------------------------------------------------
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# -------------------------------------------------------------------
# Third-Party APIs
# -------------------------------------------------------------------
openweathermap.api.key=42f8449d2dde8f937760d0b8aec0a930

# -------------------------------------------------------------------
# Security / JWT Configuration
# -------------------------------------------------------------------
security.jwt.secret=${SECURITY_JWT_SECRET:change-me-in-prod-change-me-in-prod-change-me-in-prod-32bytes}
security.jwt.expiration-seconds=86400

# -------------------------------------------------------------------
# Optional SMTP Email Configuration
# -------------------------------------------------------------------
# Leave spring.mail.username empty to skip sending (scheduler exits early).
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true