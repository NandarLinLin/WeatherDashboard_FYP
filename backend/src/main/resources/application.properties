spring.application.name=weather-api
server.port=8080

# MySQL (local dev)
spring.datasource.url=jdbc:mysql://localhost:3306/weatherwise_db
spring.datasource.username=root
spring.datasource.password=password123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

app.uploads-dir=src/main/resources/static/uploads
app.public-base-url=http://localhost:8080

openweathermap.api.key=42f8449d2dde8f937760d0b8aec0a930

# JWT (dev defaults - override in prod)
security.jwt.secret=change-me-in-prod-change-me-in-prod-change-me-in-prod-32bytes
security.jwt.expiration-seconds=86400

# Optional SMTP for automated severe-weather emails (SevereWeatherEmailScheduler).
